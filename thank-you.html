<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | Soro Group</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .soro-thanks { min-height: 100vh; display: grid; place-items: center; padding: 32px; text-align: center; background: #fffaf4; }
    .soro-thanks-card { box-sizing: border-box; width: min(680px, 100%); padding: clamp(36px, 7vw, 72px); border-radius: 28px; background: #fff; box-shadow: 0 20px 60px rgba(8, 45, 92, .12); }
    .soro-thanks h1 { margin: 0 0 16px; color: #082d5c; font-size: clamp(32px, 5vw, 50px); }
    .soro-thanks p { margin: 0 auto 28px; max-width: 48ch; color: #48566a; font-size: 18px; line-height: 1.65; }
    .soro-thanks .soro-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 13px 26px; border: 2px solid #f45a1f; border-radius: 999px; color: #fff; background: #f45a1f; font-size: 16px; font-weight: 800; line-height: 1.2; text-decoration: none; box-shadow: 0 8px 20px rgba(244, 90, 31, .22); }
    .soro-thanks .soro-btn:hover { border-color: #d94712; background: #d94712; }
    .soro-thanks .soro-btn:focus-visible { outline: 3px solid rgba(8, 45, 92, .35); outline-offset: 4px; }
  </style>
</head>
<body>
  <main class="soro-thanks">
    <section class="soro-thanks-card" aria-labelledby="thanks-title">
      <a class="soro-logo" href="index.html" aria-label="Soro Group homepage">
        <img src="assets/soro-logo-horizontal.svg" alt="Soro Group logo">
      </a>
      <h1 id="thanks-title">Thank you for reaching out.</h1>
      <p>Your message has been received. We’ll review it and follow up with you as soon as we can.</p>
      <a class="soro-btn soro-btn-primary" href="index.html">Return Home</a>
    </section>
  </main>
</body>
</html>
