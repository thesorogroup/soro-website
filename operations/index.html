<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soro Ops</title>
    <link rel="stylesheet" href="operations.css" />
    <link rel="stylesheet" href="roles.css" />
    <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="profile-dialog.css?v=20260817-profile-layout" />
  <link rel="stylesheet" href="inline-intro-video.css?v=20260820-profile-fixes" />
    <link rel="stylesheet" href="talent-profile-privacy.css?v=20260817-talent-location" />
    <link rel="stylesheet" href="talent-file-tabs.css?v=20260821-talent-file-polish" />
    <link rel="stylesheet" href="task-modal-polish.css?v=20260817-task-modal" />
    <link rel="stylesheet" href="support.css" />
    <link rel="stylesheet" href="talent-directory-filters.css?v=20260817-directory-filters" />
    <link rel="stylesheet" href="admin-skill-library.css?v=20260817-skill-library" />
    <link rel="stylesheet" href="admin-record-management.css?v=20260819-record-management" />
    <link rel="stylesheet" href="admin-permanent-deletion.css?v=20260820-record-security" />
  </head>
  <body>
    <section class="auth-checking" id="auth-checking" aria-live="polite">
      <div class="auth-checking-card">
        <img src="../assets/soro-logo-horizontal.svg" alt="Soro Group" class="auth-logo" />
        <p class="eyebrow">Soro Ops</p>
        <h1>Checking secure access…</h1>
        <p>Please wait while Soro verifies this browser session.</p>
      </div>
    </section>
    <section class="auth-gate" id="auth-gate" aria-labelledby="sign-in-title" hidden>
      <form class="auth-card" id="sign-in-form">
        <img src="../assets/soro-logo-horizontal.svg" alt="Soro Group" class="auth-logo" />
        <p class="eyebrow">Soro Ops</p>
        <h1 id="sign-in-title">Welcome back</h1>
        <p>Sign in to your secure Soro portal.</p>
        <label>Email<input name="email" type="email" autocomplete="email" required placeholder="you@thesorogroup.com" /></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="Your password" /></label>
        <button class="button primary auth-submit" type="submit">Sign in</button>
        <button class="text-button auth-reset" type="button" id="reset-password">Forgot password?</button>
        <p id="auth-message" class="auth-message" aria-live="polite"></p>
      </form>
    </section>
    <main class="app-shell" id="app" hidden>
      <aside class="sidebar" aria-label="Primary navigation">
        <a class="brand" href="#overview" aria-label="Soro Ops home"><img src="../assets/soro-logo-horizontal.svg" alt="Soro Group" /><span class="brand-ops">OPS</span></a>
        <nav id="main-nav">
          <button class="nav-link active" data-view="overview">Overview</button>
          <button class="nav-link" data-view="tasks">My Tasks <b>5</b></button>
          <button class="nav-link" data-view="clients">Clients</button>
          <button class="nav-link" data-view="vas">Talent</button>
          <button class="nav-link" data-view="placements">Placements</button>
          <button class="nav-link" data-view="documents">Documents</button>
          <button class="nav-link" data-view="reports">Reports</button>
        </nav>
        <button class="profile" id="role-switcher" aria-label="Change sample workspace"><span class="avatar">MJ</span><span><strong>Matt Johnson</strong><small id="role-label">Administrator</small></span><i>⌄</i></button>
      </aside>
      <section class="content">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open menu">☰</button>
          <label class="global-search"><span>⌕</span><input id="global-search" placeholder="Search clients, Talent, tasks…" /></label>
          <div class="top-actions"><button class="text-button" id="sign-out" type="button">Sign out</button><button class="icon-button notification-button" id="notifications-button" aria-label="View 3 notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg><em>3</em></button><button class="help" id="help-button" type="button" aria-label="Help and support">?</button></div>
        </header>
        <div id="view-root"></div>
      </section>
    </main>
    <dialog id="task-dialog"><form method="dialog" class="modal"><div class="modal-title"><h2>Add task</h2><button type="button" class="modal-close" aria-label="Close dialog">×</button></div><label>Task name<input id="task-name" required placeholder="What needs attention?" /></label><label>Due date<input type="date" /></label><label>Assign to<select><option>Me — Matt Johnson</option><option>Talent Management</option><option>Billing</option></select></label><div class="modal-actions"><button type="button" class="button modal-cancel">Cancel</button><button value="default" class="primary">Add task</button></div></form></dialog>
    <dialog id="role-dialog"><form method="dialog" class="modal"><div class="modal-title"><h2>Preview a workspace</h2><button type="button" class="modal-close" aria-label="Close dialog">×</button></div><div class="role-options"><button value="admin" class="role-option"><strong>Admin Panel</strong><small>Company-wide operations and oversight</small></button><button value="sales" class="role-option"><strong>Sales Panel</strong><small>Clients, follow-ups, and shortlists</small></button><button value="talent" class="role-option"><strong>Talent Panel</strong><small>Virtual Assistant readiness, support, and reviews</small></button><button value="client" class="role-option"><strong>Client Portal</strong><small>Active Virtual Assistants, documents, invoices, and hiring</small></button><button value="va" class="role-option"><strong>Virtual Assistant Portal</strong><small>Daily work, Dream Pathway, and support</small></button></div></form></dialog>
    <dialog id="notifications-dialog"><section class="modal notifications-modal" aria-labelledby="notifications-title"><div class="modal-title"><div><p class="eyebrow">Soro Ops</p><h2 id="notifications-title">Notifications</h2></div><button type="button" class="modal-close" aria-label="Close notifications">×</button></div><div class="notification-list"><button type="button" data-notification-view="vas"><span class="notification-dot urgent"></span><span><strong>3 Talent profiles need review</strong><small>New application information is ready for Talent Management.</small></span><b>Open</b></button><button type="button" data-notification-view="tasks"><span class="notification-dot"></span><span><strong>2 time-off requests are awaiting review</strong><small>Review the requests before the next scheduled work period.</small></span><b>Open</b></button><button type="button" data-notification-view="overview"><span class="notification-dot"></span><span><strong>1 billing verification is due tomorrow</strong><small>Confirm the payout recipient details before the pay run.</small></span><b>Open</b></button></div></section></dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=20260817-loom"></script>
    <script src="operations.js?v=20260817-loom"></script>
    <script src="talent-directory-filters.js?v=20260817-directory-filters"></script>
    <script src="admin-skill-library.js?v=20260817-skill-library"></script>
    <script src="operations-enhancements.js?v=20260819-record-management"></script>
    <script src="inline-intro-video.js?v=20260820-profile-fixes"></script>
    <script src="talent-profile-privacy.js?v=20260817-talent-location"></script>
    <script src="talent-file-tabs.js?v=20260821-talent-file-polish"></script>
    <script src="task-modal-behavior.js?v=20260817-task-modal"></script>
    <script src="auth.js?v=20260817-loom"></script>
    <script src="admin-record-management.js?v=20260820-profile-fixes"></script>
    <script src="admin-permanent-deletion.js?v=20260820-record-security"></script>
  </body>
</html>
