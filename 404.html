<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Soro Group</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .soro-not-found { min-height: 100vh; display: grid; place-items: center; padding: 32px; text-align: center; background: #fffaf4; }
    .soro-not-found-card { box-sizing: border-box; width: min(680px, 100%); padding: clamp(36px, 7vw, 72px); border-radius: 28px; background: #fff; box-shadow: 0 20px 60px rgba(8, 45, 92, .12); }
    .soro-not-found-code { margin: 0 0 8px; color: #f45a1f; font-size: clamp(64px, 14vw, 112px); font-weight: 900; line-height: 1; }
    .soro-not-found h1 { margin: 0 0 16px; color: #082d5c; font-size: clamp(30px, 5vw, 48px); }
    .soro-not-found p { margin: 0 auto 28px; max-width: 48ch; color: #48566a; font-size: 18px; line-height: 1.65; }
  </style>
</head>
<body>
  <main class="soro-not-found">
    <section class="soro-not-found-card" aria-labelledby="not-found-title">
      <a class="soro-logo" href="index.html" aria-label="Soro Group homepage">
        <img src="assets/soro-logo-horizontal.svg" alt="Soro Group logo">
      </a>
      <p class="soro-not-found-code" aria-hidden="true">404</p>
      <h1 id="not-found-title">This page wandered off.</h1>
      <p>The page you’re looking for may have moved, or the address may be incomplete. Let’s get you back to the right place.</p>
      <a class="soro-btn soro-btn-primary" href="index.html">Return Home</a>
    </section>
  </main>
</body>
</html>
