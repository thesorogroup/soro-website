[build]
  publish = "."

[[redirects]]
  from = "/about-us/"
  to = "/about-us.html"
  status = 200

[[redirects]]
  from = "/how-it-works/"
  to = "/how-it-works.html"
  status = 200

[[redirects]]
  from = "/virtual-assistants/"
  to = "/virtual-assistants.html"
  status = 200

[[redirects]]
  from = "/businesses/"
  to = "/businesses.html"
  status = 200

[[redirects]]
  from = "/contact/"
  to = "/contact.html"
  status = 200

# The repository root is the static publish directory. Keep source-only QA,
# database, planning, and server-function files unavailable as public assets.
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/planning/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/work/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PHASE-2-PORTAL-PLANNING.md"
  to = "/404.html"
  status = 404
  force = true
